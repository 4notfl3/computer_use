[project]
name = "computer-use"
version = "0.1.0"
description = "MCP 服务器项目 - 提供浏览器自动化、屏幕截图和 AI 图像分析等能力"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.4",
    "mcp[cli]>=1.27.1",
    "openai>=2.37.0",
    "pillow>=12.2.0",
    "playwright>=1.59.0",
    "playwright-stealth>=2.0.3",
    "python-dotenv>=1.2.2",
]

[tool.setuptools]
packages = ["mcp_server", "shared", "host"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]
